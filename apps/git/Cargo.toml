[package]
name = "nixe-git"
version = "0.1.0"
description = "A native Git client for the Nixe Suite"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "7cd0be5d09cd1d91510794f58bbc720605951c12" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "609c1d2a5af41a8ee3b76ba23611eb30d95a4743" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gix = { version = "0.85", default-features = false, features = ["sha1", "sha256"] }
sourceview5 = "0.11"
pangocairo = "0.22"
serde_json = "1"
tempfile = "3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
libc = "0.2"
